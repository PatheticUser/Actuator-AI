<title>Actuator AI Architecture</title>

    --amber: #f0883e;

      --border: #d0d7de;
      --border2: #e8ebef;
      --text: #1f2328;
      --text2: #57606a;
      --text3: #8c959f;
      --accent: #0969da;
      --amber: #bc4c00;
      --emerald: #1a7f37;
      --violet: #6e40c9;
      --rose: #cf222e;
      --cyan: #116329;
    }

  :root[data-theme="dark"] {

    --surface: #161b22;
    --surface2: #1c2333;
    --surface3: #21262d;
    --border: #30363d;
    --border2: #21262d;
    --text: #e6edf3;
    --text2: #8b949e;
    --text3: #6e7681;
    --accent: #58a6ff;
    --amber: #f0883e;
    --emerald: #3fb950;
    --violet: #bc8cff;

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {

    color: var(--text);

  /* ── Top bar ── */

    padding: 0 20px;

  #topbar h1 {

    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.02em;
  }
  .version-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    padding: 2px 8px;
    border-radius: 4px;
  }
  .spacer { flex: 1; }
  #topbar .legend-items {

  .legend-item {

  #main {

    flex: 1;
    overflow: hidden;
    position: relative;

  /* ── Canvas ── */
  #canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    cursor: grab;
  }
  #canvas-wrap.grabbing { cursor: grabbing; }
  #diagram-svg {
    position: absolute;
    top: 0; left: 0;
    transform-origin: 0 0;
    transition: none;
    user-select: none;
  }

  /* ── Zoom controls ── */
  #zoom-controls {
    position: absolute;
    bottom: 80px;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 5;
  }
  .zoom-btn {
    width: 32px; height: 32px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text2);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s, color 0.12s;

  .zoom-btn:hover { background: var(--surface3); color: var(--text); }

    font-size: 10px;
    color: var(--text3);

  #panel {

    flex-shrink: 0;

  #panel-header {

    align-items: flex-start;
    justify-content: space-between;
    padding: 16px 20px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;

    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;

    flex-direction: column;

  .panel-section-title {

    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 8px;

  .panel-section { display: flex; flex-direction: column; }
  .panel-desc {
    font-size: 13px;
    line-height: 1.6;
    color: var(--text2);
  }
  .tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
    color: var(--text2);
    background: var(--surface2);
  }
  .tag.endpoint {
    color: var(--accent);
    border-color: color-mix(in srgb, var(--accent) 30%, transparent);
    background: color-mix(in srgb, var(--accent) 8%, transparent);

    color: var(--emerald);
    border-color: color-mix(in srgb, var(--emerald) 30%, transparent);

    white-space: normal;
    display: block;
    width: 100%;

    background: color-mix(in srgb, var(--violet) 8%, transparent);

    background: var(--surface);
    border-top: 1px solid var(--border);

    align-items: center;
    padding: 0 20px;
    gap: 14px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;

  #play-step-info {
    flex: 1;

  }
  #play-step-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.04em;

  #play-step-desc {

    color: var(--text2);

    white-space: nowrap;

    border-radius: 5px;
    color: var(--text2);

  #play-counter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text3);
    white-space: nowrap;
  }
  #play-dots {
    display: flex;
    gap: 4px;
    align-items: center;
  }
  .play-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.2s, transform 0.2s;
    cursor: pointer;
  }
  .play-dot.active {
    background: var(--accent);
    transform: scale(1.4);
  }
  .play-dot.done { background: color-mix(in srgb, var(--accent) 40%, transparent); }

  /* ── SVG node styles (inline in SVG) ── */
  .node-group { cursor: pointer; }
  .node-group:focus { outline: none; }
  .node-rect {
    stroke-width: 1.5;
    rx: 8;
    transition: filter 0.15s;
  }
  .node-group:hover .node-rect, .node-group.selected .node-rect {
    filter: brightness(1.18) drop-shadow(0 0 8px currentColor);
  }
  .node-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    fill: #e6edf3;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
    letter-spacing: 0.02em;
  }
  .node-sublabel {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    fill: rgba(139,148,158,0.9);
    text-anchor: middle;
    pointer-events: none;
  }
  .node-icon {
    font-size: 16px;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
  }
  .edge {
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    opacity: 0.55;
    transition: opacity 0.2s, stroke-width 0.2s;
  }
  .edge.primary {
    stroke-width: 2.5;
    opacity: 0.9;
    stroke-dasharray: none;
  }
  .edge.mcp {
    stroke-dasharray: 5 4;
    opacity: 0.6;
  }
  .edge.highlighted {
    opacity: 1;
    stroke-width: 3;
    filter: drop-shadow(0 0 4px currentColor);
  }
  .edge.dimmed { opacity: 0.08; }
  .boundary-rect {
    fill: none;
    stroke-dasharray: 6 4;
    stroke-width: 1;
    rx: 12;
    pointer-events: none;
  }
  .boundary-label {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    pointer-events: none;
  }
  .flow-pulse {
    pointer-events: none;
    opacity: 0;
  }
  .flow-pulse.active {
    opacity: 1;
    animation: pulse-move 0.9s ease-in-out forwards;
  }
  @keyframes pulse-move {
    0% { opacity: 0; offset-distance: 0%; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { opacity: 0; offset-distance: 100%; }
  }
  .guardrail-stripe {
    fill: url(#guardrail-pattern);
    opacity: 0.07;
    rx: 8;
    pointer-events: none;
  }

  /* ── Responsive ── */
  @media (max-width: 700px) {
    :root { --panel-w: 100vw; }
    #topbar .legend-items { display: none; }
    #topbar h1 { font-size: 12px; }
  }
</style>

// Helper: get node center
function nodeCenter(id) {
  const n = nodes.find(x => x.id === id);
  return { x: n.x + n.w/2, y: n.y + n.h/2 };
}

// Helper: get edge attachment point from node toward target
function edgeAttach(fromId, toId, offset = 6) {
  const f = nodes.find(x => x.id === fromId);
  const t = nodes.find(x => x.id === toId);
  const fc = { x: f.x + f.w/2, y: f.y + f.h/2 };
  const tc = { x: t.x + t.w/2, y: t.y + t.h/2 };
  const dx = tc.x - fc.x, dy = tc.y - fc.y;
  const len = Math.sqrt(dx*dx + dy*dy);
  const ux = dx/len, uy = dy/len;
  // intersect with rect
  const halfW = f.w/2 + offset, halfH = f.h/2 + offset;
  const tx = ux !== 0 ? halfW / Math.abs(ux) : Infinity;
  const ty = uy !== 0 ? halfH / Math.abs(uy) : Infinity;
  const t_ = Math.min(tx, ty);
  return { x: fc.x + ux * t_, y: fc.y + uy * t_ };
}
function edgeAttachEnd(fromId, toId, offset = 6) {
  const f = nodes.find(x => x.id === fromId);
  const t = nodes.find(x => x.id === toId);
  const fc = { x: f.x + f.w/2, y: f.y + f.h/2 };
  const tc = { x: t.x + t.w/2, y: t.y + t.h/2 };
  const dx = fc.x - tc.x, dy = fc.y - tc.y;
  const len = Math.sqrt(dx*dx + dy*dy);
  const ux = dx/len, uy = dy/len;
  const halfW = t.w/2 + offset, halfH = t.h/2 + offset;
  const tx2 = ux !== 0 ? halfW / Math.abs(ux) : Infinity;
  const ty2 = uy !== 0 ? halfH / Math.abs(uy) : Infinity;
  const t_ = Math.min(tx2, ty2);
  return { x: tc.x + ux * t_, y: tc.y + uy * t_ };
}

// ── Pan & Zoom ─────────────────────────────────────────────
let tx = 0, ty = 0, scale = 1;
const wrap = document.getElementById('canvas-wrap');

function applyTransform() {
  svg.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  document.getElementById('zoom-level').textContent = Math.round(scale*100)+'%';
}

function fitView() {
  const cw = wrap.clientWidth, ch = wrap.clientHeight;
  const s = Math.min(cw / W, ch / H) * 0.92;
  scale = s;
  tx = (cw - W * s) / 2;
  ty = (ch - H * s) / 2;
  applyTransform();
}

// Initial fit on load
window.addEventListener('load', fitView);
window.addEventListener('resize', fitView);

// Drag pan
let dragging = false, dragStart = null;
wrap.addEventListener('mousedown', e => {
  if (e.target.closest('.node-group')) return;
  dragging = true; dragStart = { x: e.clientX - tx, y: e.clientY - ty };
  wrap.classList.add('grabbing');
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  tx = e.clientX - dragStart.x; ty = e.clientY - dragStart.y;
  applyTransform();
});
window.addEventListener('mouseup', () => { dragging = false; wrap.classList.remove('grabbing'); });

// Wheel zoom
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 0.9;
  const rect = wrap.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  tx = mx - (mx - tx) * factor;
  ty = my - (my - ty) * factor;
  scale = Math.max(0.2, Math.min(3, scale * factor));
  applyTransform();
}, { passive: false });

// Touch pan/zoom
let lastTouches = null;
wrap.addEventListener('touchstart', e => { lastTouches = e.touches; }, { passive: true });
wrap.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && lastTouches) {
    const dx = e.touches[0].clientX - lastTouches[0].clientX;
    const dy = e.touches[0].clientY - lastTouches[0].clientY;
    tx += dx; ty += dy; applyTransform();
  } else if (e.touches.length === 2 && lastTouches?.length === 2) {
    const d1 = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    const d0 = Math.hypot(lastTouches[0].clientX-lastTouches[1].clientX, lastTouches[0].clientY-lastTouches[1].clientY);
    const f = d1/d0;
    scale = Math.max(0.2, Math.min(3, scale * f));
    applyTransform();
  }
  lastTouches = e.touches;
}, { passive: true });

document.getElementById('btn-zoom-in').addEventListener('click', () => {
  scale = Math.min(3, scale * 1.2);
  tx = wrap.clientWidth/2 - (wrap.clientWidth/2 - tx) * 1.2;
  ty = wrap.clientHeight/2 - (wrap.clientHeight/2 - ty) * 1.2;
  applyTransform();
});
document.getElementById('btn-zoom-out').addEventListener('click', () => {
  const f = 1/1.2;
  scale = Math.max(0.2, scale * f);
  tx = wrap.clientWidth/2 - (wrap.clientWidth/2 - tx) * f;
  ty = wrap.clientHeight/2 - (wrap.clientHeight/2 - ty) * f;
  applyTransform();
});
document.getElementById('btn-zoom-fit').addEventListener('click', fitView);

    s.appendChild(t);
    const tl = document.createElement('div');
    tl.className = 'tag-list';
    n.detail.schema.forEach(f => {
      const tag = document.createElement('span');
      tag.className = 'tag schema-field';
      tag.textContent = f;
      tl.appendChild(tag);
    });
    s.appendChild(tl);
    body.appendChild(s);
  }

  // File paths
  if (n.detail.files?.length) {
    const s = document.createElement('div');
    s.className = 'panel-section';
    const t = document.createElement('div');
    t.className = 'panel-section-title';
    t.textContent = 'Source Files';
    s.appendChild(t);
    const tl = document.createElement('div');
    tl.className = 'tag-list';
    tl.style.flexDirection = 'column';
    n.detail.files.forEach(f => {
      const tag = document.createElement('span');
      tag.className = 'tag file-path';
      tag.textContent = f;
      tl.appendChild(tag);
    });
    s.appendChild(tl);
    body.appendChild(s);
  }

  // Tags
  if (n.detail.tags?.length) {
    const s = document.createElement('div');
    s.className = 'panel-section';
    const t = document.createElement('div');
    t.className = 'panel-section-title';
    t.textContent = 'Stack / Tags';
    s.appendChild(t);
    const tl = document.createElement('div');
    tl.className = 'tag-list';
    n.detail.tags.forEach(tag => {
      const el = document.createElement('span');
      el.className = 'tag';
      el.textContent = tag;
      tl.appendChild(el);
    });
    s.appendChild(tl);
    body.appendChild(s);
  }

  panel.classList.add('open');
}

document.getElementById('panel-close').addEventListener('click', () => {
  panel.classList.remove('open');
  if (selectedNode) nodeEls[selectedNode]?.classList.remove('selected');
  selectedNode = null;
});

// ── Edge highlight ─────────────────────────────────────────
function highlightEdges(nodeId) {
  edgeEls.forEach((el, i) => {
    const e = edges[i];
    if (e.from === nodeId || e.to === nodeId) {
      el.classList.add('highlighted');
      el.classList.remove('dimmed');
    } else {
      el.classList.add('dimmed');
      el.classList.remove('highlighted');
    }
  });
}
function clearHighlight() {
  edgeEls.forEach(el => { el.classList.remove('highlighted','dimmed'); });
}

// ── Flow Playback ─────────────────────────────────────────
let flowActive = false, flowStep = 0;
const playbar = document.getElementById('playbar');
const btnFlow = document.getElementById('btn-flow');
const btnNext = document.getElementById('btn-next');
const btnPrev = document.getElementById('btn-prev');
const btnStop = document.getElementById('btn-stop');
const playDots = document.getElementById('play-dots');

// Build dots
function buildDots() {
  playDots.innerHTML = '';
  flowSteps.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'play-dot' + (i === flowStep ? ' active' : i < flowStep ? ' done' : '');
    d.addEventListener('click', () => { flowStep = i; updateFlow(); });
    playDots.appendChild(d);
  });
}

function updateFlow() {
  const step = flowSteps[flowStep];
  document.getElementById('play-step-label').textContent = step.label;
  document.getElementById('play-step-desc').textContent = step.desc;
  document.getElementById('play-counter').textContent = `${flowStep+1} / ${flowSteps.length}`;
  btnPrev.disabled = flowStep === 0;
  btnNext.disabled = flowStep === flowSteps.length - 1;

  // Highlight current node
  Object.values(nodeEls).forEach(el => el.classList.remove('selected'));
  nodeEls[step.nodeId]?.classList.add('selected');

  // Highlight relevant edge
  edgeEls.forEach((el, i) => {
    if (i === step.edgeIdx) {
      el.classList.add('highlighted'); el.classList.remove('dimmed');
    } else if (step.edgeIdx !== null) {
      el.classList.add('dimmed'); el.classList.remove('highlighted');
    } else {
      el.classList.remove('highlighted','dimmed');
    }
  });

  // Update dots
  playDots.querySelectorAll('.play-dot').forEach((d,i) => {
    d.className = 'play-dot' + (i === flowStep ? ' active' : i < flowStep ? ' done' : '');
  });

  // Scroll node into view
  const n = nodes.find(x => x.id === step.nodeId);
  if (n) {
    const cx = n.x + n.w/2, cy = n.y + n.h/2;
    const tw = wrap.clientWidth, th = wrap.clientHeight;
    const targetTx = tw/2 - cx * scale;
    const targetTy = th/2 - cy * scale;
    tx += (targetTx - tx) * 0.5;
    ty += (targetTy - ty) * 0.5;
    applyTransform();
  }
}

btnFlow.addEventListener('click', () => {
  if (flowActive) {
    stopFlow();
  } else {
    startFlow();
  }
});

function startFlow() {
  flowActive = true;
  flowStep = 0;
  btnFlow.textContent = '■ Exit Flow';
  btnFlow.classList.add('active');
  playbar.classList.remove('hidden');
  buildDots();
  updateFlow();
}

function stopFlow() {
  flowActive = false;
  btnFlow.textContent = '▶ Trace Primary Flow';
  btnFlow.classList.remove('active');
  playbar.classList.add('hidden');
  clearHighlight();
  Object.values(nodeEls).forEach(el => el.classList.remove('selected'));
}

btnNext.addEventListener('click', () => { if (flowStep < flowSteps.length-1) { flowStep++; updateFlow(); } });
btnPrev.addEventListener('click', () => { if (flowStep > 0) { flowStep--; updateFlow(); } });
btnStop.addEventListener('click', stopFlow);

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (!flowActive) return;
  if (e.key === 'ArrowRight' && flowStep < flowSteps.length-1) { flowStep++; updateFlow(); }
  if (e.key === 'ArrowLeft' && flowStep > 0) { flowStep--; updateFlow(); }
  if (e.key === 'Escape') stopFlow();
});
</script>
